<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="משימות">
<title>משימות</title>
<style>
/* Sketch of a task app in an iOS-like style: a home screen with smart lists and the user's lists,
   a list screen with a large title, and a bottom sheet for editing a task. Data stays in localStorage. */
:root{
  color-scheme:light;
  --bg:#f2f2f7;
  --card:#ffffff;
  --fill:rgba(118,118,128,.12);
  --fill2:rgba(118,118,128,.2);
  --sep:rgba(60,60,67,.18);
  --ink:#000000;
  --ink2:rgba(60,60,67,.6);
  --ink3:rgba(60,60,67,.3);
  --bar:rgba(242,242,247,.8);
  --sheet:#f2f2f7;
  --blue:#007aff; --red:#ff3b30; --orange:#ff9500; --yellow:#ffcc00;
  --green:#34c759; --teal:#30b0c7; --indigo:#5856d6; --purple:#af52de;
  --pink:#ff2d55; --gray:#8e8e93; --brown:#a2845e;
  --shadow:0 0 0 .5px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#000000;
    --card:#1c1c1e;
    --fill:rgba(118,118,128,.24);
    --fill2:rgba(118,118,128,.32);
    --sep:rgba(84,84,88,.6);
    --ink:#ffffff;
    --ink2:rgba(235,235,245,.6);
    --ink3:rgba(235,235,245,.3);
    --bar:rgba(0,0,0,.72);
    --sheet:#1c1c1e;
    --blue:#0a84ff; --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a;
    --green:#30d158; --teal:#40c8e0; --indigo:#5e5ce6; --purple:#bf5af2;
    --pink:#ff375f; --gray:#98989d; --brown:#ac8e68;
    --shadow:none;
  }
  .sheet .group{background:#2c2c2e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI","Helvetica Neue",Arial,sans-serif;
  letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
svg{display:block}

/* ---------- screens ---------- */
#app{position:relative;height:100%;max-width:600px;margin:0 auto;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);
  padding:0 16px calc(96px + env(safe-area-inset-bottom));
  transition:transform .42s cubic-bezier(.32,.72,0,1), opacity .42s;
  -webkit-overflow-scrolling:touch;
}
.screen.off-left{transform:translateX(30%);opacity:.0;pointer-events:none}   /* RTL: "behind" is to the right */
.screen.off-right{transform:translateX(-100%);pointer-events:none}

/* ---------- nav bar ---------- */
.nav{
  position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display:flex;align-items:center;justify-content:space-between;min-height:52px;
  background:transparent;transition:background .2s, box-shadow .2s;
}
.nav.scrolled{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .mini{position:absolute;left:50%;transform:translateX(-50%);font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.nav.scrolled .mini{opacity:1}
.link{color:var(--blue);display:flex;align-items:center;gap:2px;font-size:17px;padding:6px 0}
.link:active{opacity:.4}
.link svg{width:20px;height:20px}
.large{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:2px 0 12px}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:10px;background:var(--fill);margin-bottom:20px;color:var(--ink2)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--ink)}
.search input::placeholder{color:var(--ink2)}

/* ---------- smart tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px}
.tile{background:var(--card);border-radius:12px;padding:10px 12px 10px;text-align:start;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;row-gap:8px;transition:transform .12s}
.tile:active{transform:scale(.97);opacity:.85}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:17px;height:17px}
.tile .n{font-size:28px;font-weight:700;line-height:30px;font-variant-numeric:tabular-nums;justify-self:end}
.tile.wide{grid-column:1/-1;grid-template-columns:auto 1fr;grid-template-rows:auto;align-items:center;column-gap:12px}
.tile.wide .t{grid-column:auto;color:var(--ink)}
.tile .t{grid-column:1/-1;font-size:15px;font-weight:600;color:var(--ink2);letter-spacing:-.24px}

/* ---------- grouped list ---------- */
.h2{font-size:22px;font-weight:700;letter-spacing:.35px;margin:0 4px 8px}
.group{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;position:relative;width:100%;text-align:start}
.row:not(:last-child)::after{content:"";position:absolute;bottom:0;left:0;inset-inline-start:58px;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.row .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:16px;height:16px}
.row .lbl{flex:1;padding:11px 0}
.row .cnt{color:var(--ink2);font-variant-numeric:tabular-nums}
.row .chev{color:var(--ink3);width:14px;height:14px;transform:scaleX(-1)}

/* ---------- task rows ---------- */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;gap:12px;padding:10px 0 0;position:relative;transition:opacity .35s, transform .35s, max-height .35s .1s;max-height:200px}
.task.leaving{opacity:0;transform:translateX(-12px);max-height:0;padding-top:0}
.chk{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.5px solid var(--ink3);display:grid;place-items:center;transition:all .2s}
.chk::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--lc,var(--blue));transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.task.done .chk{border-color:var(--lc,var(--blue))}
.task.done .chk::after{transform:scale(1)}
.task .body{flex:1;min-width:0;padding-bottom:10px;border-bottom:.5px solid var(--sep);display:flex;gap:8px}
.task:last-child .body{border-bottom-color:transparent}
.task .txt{flex:1;min-width:0}
.task .title{word-break:break-word;transition:color .2s}
.task.done .title{color:var(--ink2)}
.task .prio{color:var(--lc,var(--blue));font-weight:600;margin-inline-end:4px}
.task .notes{color:var(--ink2);font-size:15px;letter-spacing:-.24px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .meta{color:var(--ink2);font-size:15px;letter-spacing:-.24px;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
.task .meta .late{color:var(--red)}
.task .meta .lname{color:var(--ink2)}
.task .flag{color:var(--orange);flex:none;margin-top:2px}
.task .flag svg{width:15px;height:15px}
.task .info{flex:none;color:var(--blue);opacity:0;transition:opacity .15s;margin-top:1px}
.task .info svg{width:22px;height:22px}
.task:hover .info,.task:focus-within .info{opacity:1}
@media (hover:none){.task .info{opacity:1;color:var(--ink3)}}

.newrow{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.newrow .chk{border-style:solid;border-color:var(--ink3);opacity:.6}
.newrow input{flex:1;border:0;outline:none;background:none;padding:0;font-size:17px;border-bottom:.5px solid var(--sep);padding-bottom:10px}

.section-h{font-size:20px;font-weight:700;margin:22px 0 2px;color:var(--lc,var(--ink))}
.empty{color:var(--ink2);text-align:center;padding:64px 20px 0}
.empty .big{font-size:22px;font-weight:600;color:var(--ink);margin-bottom:6px}
.done-toggle{color:var(--blue);font-size:15px;margin-top:18px}

/* ---------- bottom toolbar ---------- */
.toolbar{
  position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--sep);
}
.toolbar .add{color:var(--lc,var(--blue));font-weight:600;display:flex;align-items:center;gap:8px}
.toolbar .add .plus{width:24px;height:24px;border-radius:50%;background:var(--lc,var(--blue));color:#fff;display:grid;place-items:center}
.toolbar .add .plus svg{width:14px;height:14px}
.toolbar button:active{opacity:.4}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;
  background:var(--sheet);border-radius:12px 12px 0 0;max-height:92vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);
  padding:0 16px calc(28px + env(safe-area-inset-bottom));
}
.sheet.on{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:6px auto 0}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;background:var(--sheet);z-index:1}
.sheet-nav .ttl{font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}
.sheet-nav .strong{font-weight:600}
.sheet .group{margin-bottom:24px}
.field{width:100%;border:0;outline:none;background:none;padding:11px 16px;display:block;resize:none}
.field.notes{min-height:88px;color:var(--ink)}
.field::placeholder{color:var(--ink3)}
.sep-in{height:.5px;background:var(--sep);margin-inline-start:16px}
.row .val{color:var(--ink2)}
.row input[type=date]{border:0;background:var(--fill);color:var(--ink);border-radius:7px;padding:5px 9px;font-size:15px;outline:none}
.danger{color:var(--red);justify-content:center}
.danger .lbl{text-align:center;flex:none}

/* iOS switch */
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .25s}
.sw span::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(-20px)}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:8px 16px 12px;position:relative}
.seg button{flex:1;padding:6px 0;font-size:13px;font-weight:500;border-radius:7px;position:relative;z-index:1;letter-spacing:-.08px}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme: dark){.seg button.on{background:#636366}}
.cap{font-size:13px;color:var(--ink2);text-transform:none;margin:0 16px 6px;letter-spacing:-.08px}

/* color + list pickers */
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:16px}
.colors button{aspect-ratio:1;border-radius:50%;position:relative}
.colors button.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:3px solid var(--ink3)}
.list-icon-big{width:88px;height:88px;border-radius:50%;margin:16px auto 14px;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.list-icon-big svg{width:44px;height:44px}
.name-field{background:var(--fill);border-radius:12px;text-align:center;font-size:22px;font-weight:700;padding:12px;margin:0 16px 16px;width:calc(100% - 32px)}
.pick{width:22px;height:22px;color:var(--blue)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(30,30,30,.9);color:#fff;border-radius:22px;padding:10px 16px;font-size:15px;opacity:0;transition:all .3s;z-index:30;display:flex;gap:14px;align-items:center;white-space:nowrap;backdrop-filter:blur(10px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{color:#64d2ff;font-weight:600}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="15" r="2" fill="currentColor"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 14h2M14 14h2M8 17h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-tray" viewBox="0 0 24 24"><path d="M4 13.5 6.3 6a2 2 0 0 1 1.9-1.5h7.6A2 2 0 0 1 17.7 6L20 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 13.5h4.5a3.5 3.5 0 0 0 7 0H20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4m0 1.2c4.5-2.4 9.5 2.4 14 0v9.6c-4.5 2.4-9.5-2.4-14 0" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><circle cx="5" cy="6.5" r="1.6" fill="currentColor"/><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="5" cy="17.5" r="1.6" fill="currentColor"/><path d="M9.5 6.5H20M9.5 12H20M9.5 17.5H20" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m15 4-8 8 8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.8" r="1.25" fill="currentColor"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-done" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12.3 2.8 2.8L16.2 9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<div id="app">
  <!-- Home -->
  <section class="screen" id="home">
    <div class="nav"><span></span><span class="mini">רשימות</span><button class="link" id="editBtn">עריכה</button></div>
    <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="חיפוש" autocomplete="off"></label>
    <div id="homeBody"></div>
  </section>

  <!-- List -->
  <section class="screen off-right" id="list">
    <div class="nav"><button class="link" id="backBtn"><svg><use href="#i-back"/></svg>רשימות</button><span class="mini" id="listMini"></span><button class="link" id="moreBtn">אפשרויות</button></div>
    <h1 class="large" id="listTitle"></h1>
    <div id="listBody"></div>
  </section>

  <div class="toolbar" id="toolbar">
    <button class="add" id="addTask"><span class="plus"><svg><use href="#i-plus"/></svg></span>משימה חדשה</button>
    <button class="link" id="addList">הוספת רשימה</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastUndo">ביטול</button></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const COLORS = ['blue','red','orange','yellow','green','teal','indigo','purple','pink','brown','gray'];
const cv = c => `var(--${c})`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const fmtDay = new Intl.DateTimeFormat('he-IL', {weekday:'long', day:'numeric', month:'long'});
function dueLabel(s){
  if (!s) return '';
  const t = today();
  if (s === t) return 'היום';
  if (s === addDays(1)) return 'מחר';
  if (s === addDays(-1)) return 'אתמול';
  const [y,m,d] = s.split('-').map(Number);
  return fmtDay.format(new Date(y, m-1, d));
}

/* ---------- storage ---------- */
const KEY = 'aria-tasks-v1';
function seed(){
  const L = [
    {id:'l1', name:'אישי', color:'blue'},
    {id:'l2', name:'עבודה', color:'orange'},
    {id:'l3', name:'קניות', color:'green'},
  ];
  const T = [
    ['l1','להתקשר לסבתא',  '', today(), false, 0],
    ['l1','לקבוע תור לרופא שיניים', 'בוקר, אם אפשר', addDays(2), false, 0],
    ['l1','להחזיר ספר לספרייה', '', addDays(-1), false, 1],
    ['l2','לסיים מצגת לרבעון', 'שקפים 4–9, לעדכן גרפים', today(), true, 3],
    ['l2','לשלוח הצעת מחיר ללקוח', '', addDays(1), false, 2],
    ['l2','לסדר את תיקיית הפרויקט', '', '', false, 0],
    ['l3','חלב', '', '', false, 0],
    ['l3','לחם מחמצת', '', '', false, 0],
    ['l3','אבוקדו', 'בשלים', '', false, 0],
  ].map(([listId,title,notes,due,flag,priority],i) => ({id:uid(), listId, title, notes, due, flag, priority, done:false, created:Date.now()+i}));
  T.push({id:uid(), listId:'l3', title:'קפה', notes:'', due:'', flag:false, priority:0, done:true, doneAt:Date.now(), created:Date.now()});
  return {lists:L, tasks:T};
}
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { db = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };

/* ---------- smart lists ---------- */
const SMART = {
  today:     {name:'היום',   color:'blue',   icon:'i-today', test:t => !t.done && t.due && t.due <= today()},
  scheduled: {name:'מתוכנן', color:'red',    icon:'i-cal',   test:t => !t.done && !!t.due},
  all:       {name:'הכל',    color:'gray',   icon:'i-tray',  test:t => !t.done},
  flagged:   {name:'מסומן',  color:'orange', icon:'i-flag',  test:t => !t.done && t.flag},
  completed: {name:'הושלם',  color:'gray',   icon:'i-check', test:t => t.done},
};
const listById = id => db.lists.find(l => l.id === id);

/* ---------- state ---------- */
let view = null;           // {kind:'smart'|'list', id}
let showDone = false;
let query = '';

/* ---------- home ---------- */
function renderHome(){
  const body = $('#homeBody');
  if (query){
    const q = query.toLowerCase();
    const hits = db.tasks.filter(t => (t.title + ' ' + t.notes).toLowerCase().includes(q));
    body.innerHTML = hits.length
      ? `<div class="group" style="padding:0 16px"><ul class="tasks">${hits.map(t => taskHTML(t, true)).join('')}</ul></div>`
      : `<div class="empty"><div class="big">אין תוצאות</div>נסו מילה אחרת</div>`;
    return;
  }
  const tiles = ['today','scheduled','all','flagged','completed'].map(k => {
    const s = SMART[k], n = db.tasks.filter(s.test).length;
    return `<button data-smart="${k}" class="tile${k==='completed'?' wide':''}">
      <span class="ic" style="background:${cv(s.color)}"><svg><use href="#${s.icon}"/></svg></span>
      ${k==='completed'?'':`<span class="n">${n}</span>`}<span class="t">${s.name}</span></button>`;
  }).join('');
  const lists = db.lists.map(l => {
    const n = db.tasks.filter(t => t.listId === l.id && !t.done).length;
    return `<button class="row" data-list="${l.id}">
      <span class="ic" style="background:${cv(l.color)}"><svg><use href="#i-list"/></svg></span>
      <span class="lbl">${esc(l.name)}</span><span class="cnt">${n}</span><svg class="chev"><use href="#i-chev"/></svg></button>`;
  }).join('');
  body.innerHTML = `<div class="tiles">${tiles}</div>
    <h2 class="h2">הרשימות שלי</h2>
    <div class="group">${lists || '<div class="row"><span class="lbl" style="color:var(--ink2)">אין רשימות עדיין</span></div>'}</div>`;
}

/* ---------- list screen ---------- */
function currentMeta(){
  if (!view) return null;
  if (view.kind === 'smart') return SMART[view.id];
  const l = listById(view.id); return l && {name:l.name, color:l.color};
}
function taskHTML(t, showList, hideDue){
  const l = listById(t.listId);
  const lc = l ? cv(l.color) : cv('blue');
  const late = t.due && t.due < today() && !t.done;
  const meta = [];
  if (t.due && !hideDue) meta.push(`<span class="${late?'late':''}">${dueLabel(t.due)}</span>`);
  if (showList && l) meta.push(`<span class="lname">${esc(l.name)}</span>`);
  const prio = t.priority ? `<span class="prio">${'!'.repeat(t.priority)}</span>` : '';
  return `<li class="task ${t.done?'done':''}" data-id="${t.id}" style="--lc:${lc}">
    <button class="chk" data-act="toggle" aria-label="סימון כהושלם"></button>
    <div class="body">
      <div class="txt" data-act="open">
        <div class="title">${prio}${esc(t.title)}</div>
        ${t.notes ? `<div class="notes">${esc(t.notes)}</div>` : ''}
        ${meta.length ? `<div class="meta">${meta.join('<span>·</span>')}</div>` : ''}
      </div>
      ${t.flag ? `<span class="flag"><svg><use href="#i-flag"/></svg></span>` : ''}
      <button class="info" data-act="open" aria-label="פרטים"><svg><use href="#i-info"/></svg></button>
    </div></li>`;
}
const sortTasks = arr => arr.sort((a,b) =>
  (a.done - b.done) || ((a.due||'9999') < (b.due||'9999') ? -1 : (a.due||'9999') > (b.due||'9999') ? 1 : 0) || (b.priority - a.priority) || (a.created - b.created));

function renderList(){
  const m = currentMeta(); if (!m) return;
  const scr = $('#list');
  scr.style.setProperty('--lc', cv(m.color));
  $('#toolbar').style.setProperty('--lc', cv(view.kind==='list' ? m.color : 'blue'));
  $('#listTitle').textContent = m.name;
  $('#listTitle').style.color = cv(m.color === 'gray' ? 'ink' : m.color);
  $('#listMini').textContent = m.name;
  $('#moreBtn').style.visibility = view.kind === 'list' ? 'visible' : 'hidden';
  const body = $('#listBody');

  if (view.kind === 'list'){
    const all = db.tasks.filter(t => t.listId === view.id);
    const open = sortTasks(all.filter(t => !t.done));
    const done = all.filter(t => t.done).sort((a,b) => b.doneAt - a.doneAt);
    body.innerHTML = `<ul class="tasks">${open.map(t => taskHTML(t)).join('')}</ul>
      <div class="newrow"><span class="chk"></span><input id="quick" placeholder="משימה חדשה" enterkeyhint="done" autocomplete="off"></div>
      ${done.length ? `<button class="done-toggle" id="doneToggle">${showDone ? 'הסתרת' : 'הצגת'} ${done.length} שהושלמו</button>` : ''}
      ${showDone && done.length ? `<ul class="tasks" style="margin-top:6px">${done.map(t => taskHTML(t)).join('')}</ul>` : ''}`;
    return;
  }

  const s = SMART[view.id];
  const items = sortTasks(db.tasks.filter(s.test));
  if (!items.length){
    body.innerHTML = `<div class="empty"><div class="big">${view.id==='today'?'אין משימות להיום':'אין כאן כלום'}</div>${view.id==='today'?'יום רגוע 🌿':''}</div>`;
    return;
  }
  if (view.id === 'all' || view.id === 'completed'){
    // grouped by list, like Reminders' "All"
    body.innerHTML = db.lists.map(l => {
      const g = items.filter(t => t.listId === l.id);
      return g.length ? `<div class="section-h" style="--lc:${cv(l.color)}">${esc(l.name)}</div><ul class="tasks">${g.map(t => taskHTML(t)).join('')}</ul>` : '';
    }).join('');
  } else if (view.id === 'scheduled'){
    const days = [...new Set(items.map(t => t.due))];
    body.innerHTML = days.map(d => `<div class="section-h" style="--lc:${d<today()?'var(--red)':'var(--ink)'}">${d<today()?'באיחור · ':''}${dueLabel(d)}</div>
      <ul class="tasks">${items.filter(t => t.due === d).map(t => taskHTML(t, true, d >= today())).join('')}</ul>`).join('');
  } else {
    body.innerHTML = `<ul class="tasks">${items.map(t => taskHTML(t, true)).join('')}</ul>`;
  }
}

function render(){ renderHome(); if (view) renderList(); }

/* ---------- navigation ---------- */
function openView(v){
  view = v; showDone = false;
  renderList();
  $('#list').scrollTop = 0;
  $('#home').classList.add('off-left');
  $('#list').classList.remove('off-right');
  $('#addList').style.visibility = 'hidden';
}
function goHome(){
  view = null; renderHome();
  $('#home').classList.remove('off-left');
  $('#list').classList.add('off-right');
  $('#toolbar').style.removeProperty('--lc');
  $('#addList').style.visibility = 'visible';
}
$('#backBtn').onclick = goHome;
$('#home').addEventListener('click', e => {
  const s = e.target.closest('[data-smart]'); if (s) return openView({kind:'smart', id:s.dataset.smart});
  const l = e.target.closest('[data-list]'); if (l) return openView({kind:'list', id:l.dataset.list});
});
$('#q').addEventListener('input', e => { query = e.target.value.trim(); renderHome(); });

// collapse large title into the nav bar on scroll
for (const id of ['home','list']){
  const scr = document.getElementById(id), nav = scr.querySelector('.nav');
  scr.addEventListener('scroll', () => nav.classList.toggle('scrolled', scr.scrollTop > 36), {passive:true});
}
// swipe from the right edge (RTL) to go back
let sx = null;
$('#list').addEventListener('touchstart', e => { const x = e.touches[0].clientX; sx = x > innerWidth - 24 ? x : null; }, {passive:true});
$('#list').addEventListener('touchend', e => { if (sx !== null && sx - e.changedTouches[0].clientX > 70) goHome(); sx = null; });

/* ---------- task interactions ---------- */
function onTaskClick(e){
  const li = e.target.closest('.task'); if (!li) return;
  const t = db.tasks.find(x => x.id === li.dataset.id); if (!t) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'toggle'){
    t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save();
    li.classList.toggle('done', t.done);
    if (navigator.vibrate) navigator.vibrate(8);
    const stays = view && view.kind === 'list' && showDone;
    if (!stays){
      setTimeout(() => li.classList.add('leaving'), 450);
      setTimeout(render, 800);
    } else setTimeout(render, 400);
    if (t.done) toast('המשימה הושלמה', () => { t.done = false; t.doneAt = null; save(); render(); });
  } else if (act === 'open'){
    editTask(t);
  }
}
$('#listBody').addEventListener('click', onTaskClick);
$('#homeBody').addEventListener('click', e => { if (e.target.closest('.task')) { e.stopPropagation(); onTaskClick(e); } });
$('#listBody').addEventListener('click', e => { if (e.target.id === 'doneToggle'){ showDone = !showDone; renderList(); } });
$('#listBody').addEventListener('keydown', e => {
  if (e.target.id !== 'quick' || e.key !== 'Enter' || e.isComposing) return;
  const title = e.target.value.trim(); if (!title) return;
  db.tasks.push({id:uid(), listId:view.id, title, notes:'', due:'', flag:false, priority:0, done:false, created:Date.now()});
  save(); renderList(); renderHome();
  const q = $('#quick'); q.focus();
});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, undo){
  $('#toastTxt').textContent = msg;
  $('#toastUndo').style.display = undo ? '' : 'none';
  $('#toastUndo').onclick = () => { undo && undo(); $('#toast').classList.remove('on'); };
  $('#toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 3200);
}

/* ---------- sheet ---------- */
const sheet = $('#sheet'), scrim = $('#scrim');
function openSheet(html){ sheet.innerHTML = `<div class="grab"></div>` + html; sheet.scrollTop = 0; scrim.classList.add('on'); sheet.classList.add('on'); }
function closeSheet(){ scrim.classList.remove('on'); sheet.classList.remove('on'); document.activeElement?.blur(); }
scrim.onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('on')) closeSheet(); });

function editTask(t){
  const isNew = !t;
  const defList = view?.kind === 'list' ? view.id : db.lists[0]?.id;
  const d = t ? {...t} : {id:uid(), listId:defList, title:'', notes:'', due: view?.id==='today' ? today() : '', flag: view?.id==='flagged', priority:0, done:false, created:Date.now()};
  if (!d.listId){ toast('צריך קודם ליצור רשימה'); return; }
  const prioNames = ['ללא','נמוכה','בינונית','גבוהה'];
  const draw = () => {
    const l = listById(d.listId);
    openSheet(`
      <div class="sheet-nav"><button class="link" data-x="cancel">ביטול</button><span class="ttl">${isNew?'משימה חדשה':'פרטים'}</span><button class="link strong" data-x="save">${isNew?'הוספה':'סיום'}</button></div>
      <div class="group">
        <input class="field" id="fTitle" placeholder="כותרת" value="${esc(d.title)}" autocomplete="off">
        <div class="sep-in"></div>
        <textarea class="field notes" id="fNotes" placeholder="הערות">${esc(d.notes)}</textarea>
      </div>
      <div class="group">
        <div class="row"><span class="ic" style="background:var(--red)"><svg><use href="#i-cal"/></svg></span>
          <span class="lbl">תאריך${d.due?`<div class="val" style="font-size:13px;color:var(--blue)">${dueLabel(d.due)}</div>`:''}</span>
          <label class="sw"><input type="checkbox" id="fHasDue" ${d.due?'checked':''}><span></span></label></div>
        ${d.due ? `<div class="row"><span class="lbl" style="padding-inline-start:42px">יום</span><input type="date" id="fDue" value="${d.due}"></div>` : ''}
        <div class="row"><span class="ic" style="background:var(--orange)"><svg><use href="#i-flag"/></svg></span>
          <span class="lbl">סימון</span><label class="sw"><input type="checkbox" id="fFlag" ${d.flag?'checked':''}><span></span></label></div>
      </div>
      <div class="cap">עדיפות</div>
      <div class="group"><div class="seg" id="fPrio">${prioNames.map((n,i) => `<button data-p="${i}" class="${d.priority===i?'on':''}">${n}</button>`).join('')}</div></div>
      <div class="group">
        <button class="row" data-x="pickList"><span class="ic" style="background:${cv(l.color)}"><svg><use href="#i-list"/></svg></span>
          <span class="lbl">רשימה</span><span class="val">${esc(l.name)}</span><svg class="chev"><use href="#i-chev"/></svg></button>
      </div>
      ${isNew ? '' : `<div class="group"><button class="row danger" data-x="del"><span class="lbl">מחיקת משימה</span></button></div>`}`);
    if (isNew) setTimeout(() => $('#fTitle')?.focus(), 350);
  };
  const pull = () => { d.title = $('#fTitle').value; d.notes = $('#fNotes').value; };
  sheet.onclick = e => {
    const x = e.target.closest('[data-x]')?.dataset.x;
    const p = e.target.closest('[data-p]');
    if (p){ pull(); d.priority = +p.dataset.p; draw(); return; }
    if (x === 'cancel') return closeSheet();
    if (x === 'save'){
      pull(); d.title = d.title.trim();
      if (!d.title){ $('#fTitle').focus(); return; }
      if (isNew) db.tasks.push(d); else Object.assign(t, d);
      save(); closeSheet(); render(); return;
    }
    if (x === 'del'){
      const i = db.tasks.indexOf(t); db.tasks.splice(i, 1); save(); closeSheet(); render();
      toast('המשימה נמחקה', () => { db.tasks.splice(i, 0, t); save(); render(); }); return;
    }
    if (x === 'pickList'){ pull(); pickList(d, draw); }
  };
  sheet.onchange = e => {
    if (e.target.id === 'fHasDue'){ pull(); d.due = e.target.checked ? today() : ''; draw(); }
    if (e.target.id === 'fDue'){ pull(); d.due = e.target.value; draw(); }
    if (e.target.id === 'fFlag'){ d.flag = e.target.checked; }
  };
  sheet.onkeydown = e => { if (e.target.id === 'fTitle' && e.key === 'Enter' && !e.isComposing) sheet.querySelector('[data-x=save]').click(); };
  draw();
}

function pickList(d, back){
  sheet.innerHTML = `<div class="grab"></div><div class="sheet-nav"><button class="link" data-y="back"><svg><use href="#i-back"/></svg>חזרה</button><span class="ttl">רשימה</span><span></span></div>
    <div class="group">${db.lists.map(l => `<button class="row" data-y="${l.id}"><span class="ic" style="background:${cv(l.color)}"><svg><use href="#i-list"/></svg></span><span class="lbl">${esc(l.name)}</span>${l.id===d.listId?'<svg class="pick"><use href="#i-check"/></svg>':''}</button>`).join('')}</div>`;
  const prev = sheet.onclick;
  sheet.onclick = e => {
    const y = e.target.closest('[data-y]')?.dataset.y; if (!y) return;
    if (y !== 'back') d.listId = y;
    sheet.onclick = prev; back();
  };
}

function editList(l){
  const isNew = !l;
  const d = l ? {...l} : {id:uid(), name:'', color:'blue'};
  const draw = () => {
    openSheet(`
      <div class="sheet-nav"><button class="link" data-x="cancel">ביטול</button><span class="ttl">${isNew?'רשימה חדשה':'פרטי רשימה'}</span><button class="link strong" data-x="save">${isNew?'הוספה':'סיום'}</button></div>
      <div class="group" style="padding-bottom:0">
        <div class="list-icon-big" style="background:${cv(d.color)}"><svg><use href="#i-list"/></svg></div>
        <input class="field name-field" id="lName" value="${esc(d.name)}" placeholder="שם הרשימה" style="color:${cv(d.color)}" autocomplete="off">
      </div>
      <div class="group"><div class="colors">${COLORS.map(c => `<button data-c="${c}" class="${c===d.color?'on':''}" style="background:${cv(c)}" aria-label="${c}"></button>`).join('')}</div></div>
      ${isNew ? '' : `<div class="group"><button class="row danger" data-x="del"><span class="lbl">מחיקת רשימה</span></button></div>`}`);
    if (isNew) setTimeout(() => $('#lName')?.focus(), 350);
  };
  sheet.onchange = null;
  sheet.onkeydown = e => { if (e.target.id === 'lName' && e.key === 'Enter' && !e.isComposing) sheet.querySelector('[data-x=save]').click(); };
  sheet.onclick = e => {
    const c = e.target.closest('[data-c]');
    if (c){ d.name = $('#lName').value; d.color = c.dataset.c; draw(); return; }
    const x = e.target.closest('[data-x]')?.dataset.x;
    if (x === 'cancel') return closeSheet();
    if (x === 'save'){
      d.name = $('#lName').value.trim(); if (!d.name){ $('#lName').focus(); return; }
      if (isNew) db.lists.push(d); else Object.assign(l, d);
      save(); closeSheet(); render(); return;
    }
    if (x === 'del'){
      const n = db.tasks.filter(t => t.listId === l.id).length;
      if (n && !confirm(`למחוק את "${l.name}" ואת ${n} המשימות שבה?`)) return;
      db.lists = db.lists.filter(x => x !== l); db.tasks = db.tasks.filter(t => t.listId !== l.id);
      save(); closeSheet(); goHome();
    }
  };
  draw();
}

$('#addTask').onclick = () => editTask(null);
$('#addList').onclick = () => editList(null);
$('#moreBtn').onclick = () => view?.kind === 'list' && editList(listById(view.id));
$('#editBtn').onclick = () => toast('סידור רשימות יגיע בגרסה הבאה');

render();
})();
</script>
</body>
</html>
